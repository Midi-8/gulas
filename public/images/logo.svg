<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <!-- Gulas Emblem Mark -->
  <g transform="translate(6, 6)">
    <!-- Artisan Rounded Square Emblem Background -->
    <rect width="52" height="52" rx="14" fill="#5E4939" />
    <rect x="2" y="2" width="48" height="48" rx="12" stroke="#C09573" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Stylized "G" Emblem with Flame/Artisan Oven Accent -->
    <path d="M 36 21 C 33 17 28 15 22 15 C 15.5 15 11 20 11 27 C 11 34 15.5 39 22 39 C 29 39 34 35 35 29 L 23 29" 
          stroke="#F5F4F1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Caramel Warm Spark Dot -->
    <circle cx="34" cy="21" r="3.2" fill="#C09573" />
  </g>

  <!-- Typography: Wordmark "GULAS" -->
  <text x="72" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#35271F">
    GULAS
  </text>

  <!-- Tagline: "PIZZA • BURGER • COFFEE" -->
  <text x="73" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="9" font-weight="800" letter-spacing="0.14em" fill="#C09573">
    PIZZA &bull; BURGER &bull; COFFEE
  </text>
</svg>
